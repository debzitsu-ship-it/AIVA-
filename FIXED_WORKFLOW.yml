name: Build AIVA APK

on:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :aiva-ui:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aiva-debug-apk
          path: aiva-ui/build/outputs/apk/debug/aiva-ui-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build Release APK (if keystore configured)
        if: env.KEYSTORE_PATH != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        run: ./gradlew :aiva-ui:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: env.KEYSTORE_PATH != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        uses: actions/upload-artifact@v5
        with:
          name: aiva-release-apk
          path: aiva-ui/build/outputs/apk/release/aiva-ui-release.apk
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Lint
        run: ./gradlew :aiva-ui:lintDebug --no-daemon --stacktrace --warning-mode all
        continue-on-error: false
      - name: Run Type Check (Kotlin)
        run: ./gradlew :aiva-ui:assembleDebug --no-daemon -x lint --continue || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --continue --stacktrace

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
