name: Build AIVA APK

on:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :aiva-ui:assembleDebug --no-daemon --stacktrace --warning-mode all
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: aiva-debug-apk
          path: aiva-ui/build/outputs/apk/debug/aiva-ui-debug.apk
          if-no-files-found: warn
          retention-days: 30
      - if: env.KEYSTORE_PATH != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        run: ./gradlew :aiva-ui:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        if: env.KEYSTORE_PATH != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        with:
          name: aiva-release-apk
          path: aiva-ui/build/outputs/apk/release/aiva-ui-release.apk
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: '17', distribution: 'temurin', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :aiva-ui:lintDebug --no-daemon --stacktrace --warning-mode all
      - run: ./gradlew :aiva-ui:assembleDebug --no-daemon -x lint --continue || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: '17', distribution: 'temurin', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --continue --stacktrace

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true